name: Build signed Windows installer

# Produce an Authenticode-signed NSIS installer and optionally replace the
# installer on an existing GitHub release. Requires a code-signing certificate
# stored as repository secrets; see docs/windows-code-signing.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the signed installer to (e.g. v1.2.0). Leave blank to build only.'
        required: false
        type: string
      replace_release_asset:
        description: 'Replace the installer asset on that release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  signed-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Import code-signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_TIMESTAMP_URL: ${{ vars.WINDOWS_CERTIFICATE_TIMESTAMP_URL }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw 'Add WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD repository secrets first (see docs/windows-code-signing.md).'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $cert) { throw 'The certificate could not be imported.' }
          "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $timestamp = if ($env:WINDOWS_CERTIFICATE_TIMESTAMP_URL) { $env:WINDOWS_CERTIFICATE_TIMESTAMP_URL } else { 'http://timestamp.digicert.com' }
          "CERT_TIMESTAMP_URL=$timestamp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Remove-Item $pfx -Force

      - name: Configure Tauri signing
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.bundle.windows={certificateThumbprint:process.env.CERT_THUMBPRINT,digestAlgorithm:'sha256',timestampUrl:process.env.CERT_TIMESTAMP_URL};fs.writeFileSync(p, JSON.stringify(c,null,2)+'\n');"

      - name: Build signed installer and updater artifacts
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'Add TAURI_SIGNING_PRIVATE_KEY as a repository secret so updates can be signed (see docs/in-app-updates.md).'
          }
          npm run tauri build

      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*setup.exe' | Select-Object -First 1
          if (-not $exe) { throw 'No NSIS installer was produced.' }
          $signature = Get-AuthenticodeSignature -FilePath $exe.FullName
          if ($signature.Status -ne 'Valid') { throw "Installer signature is not valid: $($signature.Status)" }
          Write-Host "Signed installer: $($exe.FullName)"
          Write-Host "Signer: $($signature.SignerCertificate.Subject)"
          "INSTALLER_PATH=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create updater manifest
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $sig = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*.exe.sig' | Select-Object -First 1
          if (-not $sig) { throw 'No updater signature was produced by the build.' }
          $version = if ($env:TAG) { $env:TAG.TrimStart('v') } else { node -p "require('./package.json').version" }
          $output = Join-Path 'src-tauri/target/release/bundle/nsis' 'latest.json'
          node scripts/create-update-manifest.mjs --installer "$env:INSTALLER_PATH" --signature "$($sig.FullName)" --version $version --tag "$env:TAG" --out "$output"
          "SIGNATURE_PATH=$($sig.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MANIFEST_PATH=$output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Replace the installer and updater artifacts on the release
        if: ${{ inputs.tag != '' && inputs.replace_release_asset }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload '${{ inputs.tag }}' `
            "$env:INSTALLER_PATH#Windows x64 installer" `
            "$env:SIGNATURE_PATH#Windows x64 update signature" `
            "$env:MANIFEST_PATH#Updater manifest" `
            --repo '${{ github.repository }}' --clobber
