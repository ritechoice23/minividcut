[package]
name = "minividcut"
version = "1.0.0"
description = "A lightweight local video cutter"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tempfile = "3"
reqwest = "0.13"
tokio = { version = "1", features = ["time"] }
sha2 = "0.10"
transcribe-cpp = { version = "=0.4.2", default-features = false }
# The bindings require the same native version at runtime.
transcribe-cpp-sys = { version = "=0.4.2", default-features = false }


[features]
custom-protocol = ["tauri/custom-protocol"]
